baseURL = "https://xdishhh.github.io/"
languageCode = "en-us"
title = "ish"
theme = "hugo-theme-nostyleplease"
buildDrafts = false
cleanDestinationDir = true
ignoreFiles = ["^themes/hugo-theme-nostyleplease/content/.*"]
disableKinds = ["taxonomy", "term"]

[module]
  [module.hugoVersion]
    extended = true
    min = "0.41.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    style = "rrt"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  favicon = "favicon.svg"
  [params.theme_config]
    appearance = "dark"
    back_home_text = ".."
    date_format = "2006-01-02"
    isListGroupByDate = false
    isShowFooter = true
    show_description = true
    description = "Personal notes on code, learning, and experiments."
